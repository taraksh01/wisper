[package]
name = "wisper"
version = "3.3.0-beta.10"
description = "Turn your voice into text right on your device, with your privacy always in your hands."
authors = ["Tarak Shaw <taraksh01@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wisper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.1"
hound = "3.5.1"
libc = "0.2"
futures-util = "0.3"
reqwest = { version = "0.13.4", features = ["blocking", "json", "multipart", "stream"] }
tokio = { version = "1.52.3", features = ["full"] }
dirs = "6.0.0"
arboard = "3.6.1"
enigo = "0.6.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
once_cell = "1.21.4"
transcribe-rs = { version = "0.3.11", features = ["onnx"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.4"
regex = "1"
base64 = "0.22"
handy-keys = "0.3.0"
image = "0.25"
sherpa-onnx = "1.13.5"
ort = "2.0.0-rc.12"
ndarray = "0.17"

# Pin windows-core: cpal 0.18 breaks against 0.62 (E0277/E0599).
[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "=0.61.2"
# Win32 surface for taskbar-aware overlay placement and origin window capture.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

# WebviewWindowBuilder::transparent only exists on macOS with this feature;
# the overlay pill needs it (see app.macosPrivateApi in tauri.conf.json).
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
# NSScreen.visibleFrame for Dock-aware overlay placement.
objc2 = "0.6"
objc2-foundation = "0.3"
# objc2-core-graphics: NSBitmapImageRep::initWithCGImage for origin icons.
objc2-app-kit = { version = "0.3", features = ["objc2-core-graphics"] }

# Patched wry: drop malformed custom-scheme tasks instead of aborting across
# the macOS FFI boundary (upstream tauri-apps/wry#1744, unmerged). Remove once
# upstream ships the fix.
[patch.crates-io]
wry = { git = "https://github.com/taraksh01/wry", branch = "wisper/url-scheme-nil-guard" }

