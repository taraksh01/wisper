name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build (linux, windows, macos, all)"
        required: false
        default: "all"
        type: choice
        options: ["all", "linux", "windows", "macos"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Three separate jobs (not a matrix) so each channel builds only its
# platforms: stable tags build Linux + Windows + macOS, beta tags build
# macOS only (beta feed). A skipped job shows gray instead of failing the
# run. Job-level `if` only uses github/event/inputs contexts - never matrix
# (unavailable there and fails the run at startup). Plain v tags are the
# only supported trigger: tagName v__VERSION__ must match the pushed tag.

jobs:
  release-linux:
    # Stable tags only (beta tags skip Linux and build macOS only).
    if: ${{ (github.event_name == 'push' && !contains(github.ref_name, 'beta')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libasound2-dev libayatana-appindicator3-dev patchelf rpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Guard tag matches version
        shell: bash
        run: |
          ver=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          pkg=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          cargo=$(python3 -c "import re; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', open('src-tauri/Cargo.toml').read(), re.M).group(1))")
          [ "$ver" = "$pkg" ] && [ "$ver" = "$cargo" ] || { echo "version drift: tauri=$ver pkg=$pkg cargo=$cargo"; exit 1; }
          if [ "${{ github.event_name }}" = "push" ]; then [ "v$ver" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} != v$ver"; exit 1; }; fi

      - name: Build + release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: Wisper v__VERSION__
          releaseBody: "See the assets below: Linux packages (deb, rpm, AppImage), Windows installer (NSIS), macOS disk images (Apple Silicon and Intel)."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          uploadUpdaterJson: true

  release-windows:
    # Stable tags only (beta tags skip Windows and build macOS only).
    if: ${{ (github.event_name == 'push' && !contains(github.ref_name, 'beta')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows')) }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Guard tag matches version
        shell: bash
        run: |
          ver=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          pkg=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          cargo=$(python3 -c "import re; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', open('src-tauri/Cargo.toml').read(), re.M).group(1))")
          [ "$ver" = "$pkg" ] && [ "$ver" = "$cargo" ] || { echo "version drift: tauri=$ver pkg=$pkg cargo=$cargo"; exit 1; }
          if [ "${{ github.event_name }}" = "push" ]; then [ "v$ver" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} != v$ver"; exit 1; }; fi

      - name: Build + release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: Wisper v__VERSION__
          releaseBody: "See the assets below: Linux packages (deb, rpm, AppImage), Windows installer (NSIS), macOS disk images (Apple Silicon and Intel)."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true

  release-macos:
    # All tags: stable releases ship macOS (stable updater feed), beta tags
    # keep the beta feed via tauri.beta.json (see Build step below).
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos')) }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Guard tag matches version
        shell: bash
        run: |
          ver=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          pkg=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          cargo=$(python3 -c "import re; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', open('src-tauri/Cargo.toml').read(), re.M).group(1))")
          [ "$ver" = "$pkg" ] && [ "$ver" = "$cargo" ] || { echo "version drift: tauri=$ver pkg=$pkg cargo=$cargo"; exit 1; }
          if [ "${{ github.event_name }}" = "push" ]; then [ "v$ver" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} != v$ver"; exit 1; }; fi

      - name: Install ONNX Runtime (Intel macOS)
        # Microsoft ships no x86_64 macOS ONNX Runtime binaries, so ort-sys has
        # nothing to download. Use the community build and link dynamically,
        # bundling the dylib into the app Frameworks below.
        # Apple Silicon uses the official ort-sys download; skip this step.
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          ORT_VERSION="1.24.2"
          curl -L -o ort.tgz "https://blob.handy.computer/onnxruntime-osx-x86_64-${ORT_VERSION}.tgz"
          tar xzf ort.tgz
          ORT_DIR="$(pwd)/onnxruntime-osx-x86_64-${ORT_VERSION}"
          echo "ORT_LIB_LOCATION=$ORT_DIR/lib" >> $GITHUB_ENV
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> $GITHUB_ENV
          jq --arg lib "$ORT_DIR/lib/libonnxruntime.${ORT_VERSION}.dylib" \
            '.bundle.macOS.frameworks = [$lib]' \
            src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      - name: Build + release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: Wisper v__VERSION__
          releaseBody: "${{ contains(github.ref_name, 'beta') && 'macOS beta - unsigned DMG below. Right-click + Open on first launch, then grant Microphone and Accessibility access. Not for production use yet.' || 'See the assets below: Linux packages (deb, rpm, AppImage), Windows installer (NSIS), macOS disk images (Apple Silicon and Intel). Unsigned Mac build: right-click + Open on first launch, then grant Microphone and Accessibility access.' }}"
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          uploadUpdaterJson: true
          # Beta builds point the in-app updater at the rolling beta feed
          # instead of /latest (which excludes prereleases). Stable builds
          # use the default stable endpoint.
          args: ${{ contains(github.ref_name, 'beta') && format('--target {0} --config "{1}/src-tauri/tauri.beta.json"', matrix.target, github.workspace) || format('--target {0}', matrix.target) }}

      - name: Verify dylib bundling
        # Only the Intel community build injects a Frameworks dylib (see above).
        #
        # Do not glob for *.app under src-tauri/target: the bundle also ships
        # a Linux Electron helper at resources/gnome-shell/*.app, and a
        # wildcard can match that one instead of the macOS bundle. Always
        # resolve the real bundle path from the matrix target.
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Wisper.app"
          BIN="$APP/Contents/MacOS/wisper"
          FW="$APP/Contents/Frameworks"
          test -d "$APP" || { echo "MISSING: app bundle not found at $APP"; exit 1; }
          test -x "$BIN" || { echo "MISSING: binary not found at $BIN"; exit 1; }

          echo "Frameworks:"
          ls -la "$FW" || true

          echo "onnxruntime linkage:"
          otool -L "$BIN" | grep -i onnx || { echo "MISSING: binary does not link onnxruntime"; exit 1; }

          # Every @rpath dependency must ship inside Frameworks, otherwise the
          # app fails to launch on a clean machine. No `while ... done` subshell
          # here: an exit inside the pipe would not fail the step.
          missing=0
          for dep in $(otool -L "$BIN" | awk '/@rpath\//{print $1}'); do
            libname=$(basename "$dep")
            if [ ! -f "$FW/$libname" ]; then
              echo "MISSING: $libname not found in Frameworks/"
              missing=1
            else
              echo "ok: $libname"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

  # Republishes this tag's latest.json to a floating `beta` release so
  # installed mac betas (which point at .../releases/download/beta/latest.json)
  # discover new betas in-app. Stable /latest never includes prereleases,
  # so stable installs are unaffected.
  beta-feed:
    needs: release-macos
    if: github.event_name == 'push' && contains(github.ref_name, 'beta')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch this tag's latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/betafeed && mkdir -p /tmp/betafeed
          gh release download "${{ github.ref_name }}" --pattern "latest.json" --dir /tmp/betafeed

      - name: Republish floating beta feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete beta --yes || true
          git push origin :refs/tags/beta || true
          git tag -d beta || true
          gh release create beta --prerelease --title "Beta channel" --notes "Rolling beta feed for Wisper beta installs. Use the latest versioned beta for full installers." /tmp/betafeed/latest.json
