name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build (linux, windows, macos, all)"
        required: false
        default: "all"
        type: choice
        options: ["all", "linux", "windows", "macos"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Three separate jobs (not a matrix) so each channel builds only its
# platforms: stable tags build Linux + Windows, beta tags build macOS
# only. A skipped job shows gray instead of failing the run. Job-level
# `if` only uses github/event/inputs contexts - never matrix (unavailable
# there and fails the run at startup). Plain v tags are the only
# supported trigger: tagName v__VERSION__ must match the pushed tag.

jobs:
  release-linux:
    # Stable tags only. Beta tags (containing 'beta') build macOS only.
    if: ${{ (github.event_name == 'push' && !contains(github.ref_name, 'beta')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libasound2-dev libayatana-appindicator3-dev patchelf rpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Guard tag matches version
        shell: bash
        run: |
          ver=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          pkg=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          cargo=$(python3 -c "import re; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', open('src-tauri/Cargo.toml').read(), re.M).group(1))")
          [ "$ver" = "$pkg" ] && [ "$ver" = "$cargo" ] || { echo "version drift: tauri=$ver pkg=$pkg cargo=$cargo"; exit 1; }
          if [ "${{ github.event_name }}" = "push" ]; then [ "v$ver" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} != v$ver"; exit 1; }; fi

      - name: Build + release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: Wisper v__VERSION__
          releaseBody: "See the assets below for the Linux packages (deb, rpm, AppImage)."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          uploadUpdaterJson: true

  release-windows:
    # Stable tags only. Windows graduated from beta; beta tags build macOS only.
    if: ${{ (github.event_name == 'push' && !contains(github.ref_name, 'beta')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows')) }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Guard tag matches version
        shell: bash
        run: |
          ver=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          pkg=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          cargo=$(python3 -c "import re; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', open('src-tauri/Cargo.toml').read(), re.M).group(1))")
          [ "$ver" = "$pkg" ] && [ "$ver" = "$cargo" ] || { echo "version drift: tauri=$ver pkg=$pkg cargo=$cargo"; exit 1; }
          if [ "${{ github.event_name }}" = "push" ]; then [ "v$ver" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} != v$ver"; exit 1; }; fi

      - name: Build + release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: Wisper v__VERSION__
          releaseBody: "See the assets below for the Windows installer (NSIS)."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true

  release-macos:
    # Beta tags only. macOS is in beta verification; stable tags build Linux + Windows.
    if: ${{ (github.event_name == 'push' && contains(github.ref_name, 'beta')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos')) }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Guard tag matches version
        shell: bash
        run: |
          ver=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          pkg=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          cargo=$(python3 -c "import re; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', open('src-tauri/Cargo.toml').read(), re.M).group(1))")
          [ "$ver" = "$pkg" ] && [ "$ver" = "$cargo" ] || { echo "version drift: tauri=$ver pkg=$pkg cargo=$cargo"; exit 1; }
          if [ "${{ github.event_name }}" = "push" ]; then [ "v$ver" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} != v$ver"; exit 1; }; fi

      - name: Build + release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: Wisper v__VERSION__ (macOS beta)
          releaseBody: "macOS beta - unsigned DMG below (Apple Silicon). Right-click + Open on first launch, then grant Microphone and Accessibility access. Not for production use yet."
          releaseDraft: true
          prerelease: true
          uploadUpdaterJson: true
          # Beta builds point the in-app updater at the rolling beta feed
          # instead of /latest (which excludes prereleases).
          args: ${{ format('--config "{0}/src-tauri/tauri.beta.json"', github.workspace) }}

  # Republishes this tag's latest.json to a floating `beta` release so
  # installed mac betas (which point at .../releases/download/beta/latest.json)
  # discover new betas in-app. Stable /latest never includes prereleases,
  # so stable installs are unaffected.
  beta-feed:
    needs: release-macos
    if: github.event_name == 'push' && contains(github.ref_name, 'beta')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch this tag's latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/betafeed && mkdir -p /tmp/betafeed
          gh release download "${{ github.ref_name }}" --pattern "latest.json" --dir /tmp/betafeed

      - name: Republish floating beta feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete beta --yes || true
          git push origin :refs/tags/beta || true
          git tag -d beta || true
          gh release create beta --prerelease --title "Beta channel" --notes "Rolling beta feed for Wisper beta installs. Use the latest versioned beta for full installers." /tmp/betafeed/latest.json
